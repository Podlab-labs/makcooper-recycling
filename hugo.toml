baseURL = 'https://example.org/'
locale = 'en-AU'
title = 'Max & Cooper Recycling'
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

pygmentsUseClasses = true

[minify]
  disableXML = true

[params]
  env = 'production'
  title = 'Max & Cooper Recycling'
  description = "Max and Cooper's charity can recycling drive — collecting cans and bottles to raise money for a good cause."
  keywords = ['recycling', 'charity', 'cans', 'containers for change', 'fundraising']
  author = 'Max & Cooper'
  DateFormat = '2 January 2006'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.homeInfoParams]
    Title = "Hi, we're Max & Cooper! \U0001F44B"
    Content = "We're two brothers collecting and recycling cans and bottles to raise money for charity. Follow our progress, see how much we've collected, and find out how you can help."

  [params.assets]
    disableHLJS = true
    favicon = "/favicon.ico"

  [params.label]
    text = "Max & Cooper Recycling"
    icon = "/favicon.ico"
    iconHeight = 35

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[[menu.main]]
  identifier = 'home'
  name = 'Home'
  url = '/'
  weight = 10

[[menu.main]]
  identifier = 'about'
  name = 'About Us'
  url = '/about/'
  weight = 20

[[menu.main]]
  identifier = 'updates'
  name = 'Updates'
  url = '/updates/'
  weight = 30

[[menu.main]]
  identifier = 'contact'
  name = 'Contact'
  url = '/contact/'
  weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
