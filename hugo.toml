baseURL = 'https://maxcooper-recycling.pages.dev/'
locale = 'en-AU'
title = 'Mak & Cooper Recycling'
theme = 'PaperMod'
timeZone = 'Australia/Sydney'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

pygmentsUseClasses = true

[minify]
  disableXML = true

[params]
  env = 'production'
  title = 'Mak & Cooper Recycling'
  description = "Mak and Cooper's charity can recycling drive — collecting cans and bottles to raise money for a good cause."
  keywords = ['recycling', 'charity', 'cans', 'containers for change', 'fundraising']
  author = 'Mak & Cooper'
  DateFormat = '2 January 2006'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.profileMode]
    enabled = true
    title = "Hi, we're Mak & Cooper! \U0001F44B"
    subtitle = "Mak & Cooper’s Recycling offers FREE regular pick ups and a FREE 240L bin for our regular supporters.<br>No sorting, no mess, no trips to Return & Earn – we do it all for you!<br><br>📞 Text <a href=\"tel:0422396217\">0422 396 217</a>"
    imageUrl = "images/mak-cooper.jpeg"
    imageTitle = "Mak and Cooper"
    imageWidth = 200
    imageHeight = 200

    [[params.profileMode.buttons]]
      name = "Our Story"
      url = "/about/"

    [[params.profileMode.buttons]]
      name = "Updates"
      url = "/updates/"

    [[params.profileMode.buttons]]
      name = "Contact"
      url = "/contact/"

  [params.assets]
    disableHLJS = true
    favicon = "/favicon.ico"

  [params.label]
    text = "♻️ Mak & Cooper Recycling"
    icon = "/favicon.ico"
    iconHeight = 35

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[[menu.main]]
  identifier = 'home'
  name = 'Home'
  url = '/'
  weight = 10

[[menu.main]]
  identifier = 'about'
  name = 'About Us'
  url = '/about/'
  weight = 20

[[menu.main]]
  identifier = 'updates'
  name = 'Updates'
  url = '/updates/'
  weight = 30

[[menu.main]]
  identifier = 'contact'
  name = 'Contact'
  url = '/contact/'
  weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
